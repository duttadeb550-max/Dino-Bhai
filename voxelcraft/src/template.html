<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VoxelCraft</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #87b7e8; }
  body { font-family: "Segoe UI", Tahoma, sans-serif; user-select: none; }
  canvas { display: block; image-rendering: pixelated; }

  #hud { position: fixed; inset: 0; pointer-events: none; }

  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 22px; height: 22px;
    transform: translate(-50%, -50%); opacity: .85;
  }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: #fff; mix-blend-mode: difference;
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

  #stats {
    position: absolute; top: 10px; left: 10px; color: #fff; font-size: 12px;
    line-height: 1.5; text-shadow: 1px 1px 0 rgba(0,0,0,.7); white-space: pre;
  }

  #hotbar {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 4px; background: rgba(0,0,0,.35);
    border: 2px solid rgba(255,255,255,.25); border-radius: 4px;
  }
  .slot {
    width: 46px; height: 46px; border: 2px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.3); position: relative; display: flex;
    align-items: center; justify-content: center;
  }
  .slot.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.5) inset; background: rgba(255,255,255,.15); }
  .slot img { width: 34px; height: 34px; image-rendering: pixelated; }
  .slot span {
    position: absolute; top: 1px; left: 3px; font-size: 10px; color: #ddd;
    text-shadow: 1px 1px 0 #000;
  }

  #itemName {
    position: absolute; bottom: 78px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 15px; text-shadow: 1px 1px 0 rgba(0,0,0,.8);
    opacity: 0; transition: opacity .4s;
  }

  #waterTint {
    position: absolute; inset: 0; background: rgba(20, 60, 160, .35);
    opacity: 0; transition: opacity .2s;
  }

  #overlay {
    position: fixed; inset: 0; background: rgba(8, 14, 24, .82);
    display: flex; align-items: center; justify-content: center; z-index: 10;
    color: #eee; text-align: center; cursor: pointer;
  }
  #overlay .panel { max-width: 560px; padding: 32px; }
  #overlay h1 {
    font-size: 52px; letter-spacing: 4px; color: #fff;
    text-shadow: 3px 3px 0 #2a5c1e, 5px 5px 0 rgba(0,0,0,.5); margin-bottom: 6px;
  }
  #overlay h2 { font-size: 15px; font-weight: 400; color: #9fd07a; margin-bottom: 24px; }
  #overlay .keys {
    display: grid; grid-template-columns: auto auto; gap: 6px 18px;
    text-align: left; font-size: 14px; margin: 0 auto 26px; width: fit-content;
  }
  #overlay .keys b { color: #ffd76e; font-weight: 600; }
  #overlay .play {
    display: inline-block; padding: 14px 42px; background: #4c9e3a;
    border: 2px solid #2f6b22; border-radius: 4px; font-size: 19px;
    color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,.4);
    box-shadow: 0 4px 0 #2f6b22;
  }
  #overlay .play:active { transform: translateY(3px); box-shadow: 0 1px 0 #2f6b22; }
  #overlay .hint { margin-top: 18px; font-size: 12px; color: #8899aa; }
</style>
</head>
<body>
<div id="hud">
  <div id="waterTint"></div>
  <div id="crosshair"></div>
  <div id="stats"></div>
  <div id="itemName"></div>
  <div id="hotbar"></div>
</div>

<div id="overlay">
  <div class="panel">
    <h1>VOXELCRAFT</h1>
    <h2>a tiny open-world block sandbox</h2>
    <div class="keys">
      <b>W A S D</b><span>move</span>
      <b>Mouse</b><span>look around</span>
      <b>Space</b><span>jump / swim / fly up</span>
      <b>Shift</b><span>sprint / fly down</span>
      <b>Left click</b><span>break block</span>
      <b>Right click</b><span>place block</span>
      <b>1 – 9 / wheel</b><span>choose block</span>
      <b>F</b><span>toggle fly</span>
      <b>Esc</b><span>release mouse</span>
    </div>
    <div class="play">Click to play</div>
    <div class="hint">Runs fully offline · world edits persist while you play</div>
  </div>
</div>

<script id="game-bundle"></script>
</body>
</html>
